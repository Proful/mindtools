<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Match It — Fractions, Decimals & Percents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20303B;
    --paper:#F6F5F1;
    --card-back:#2F4858;
    --card-back-2:#38566A;
    --teal:#2E8B84;
    --teal-deep:#1F6660;
    --coral:#E96A4E;
    --line:#DAD6CB;
    --white:#FFFFFF;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    overscroll-behavior:none;
  }

  body{
    display:flex;
    justify-content:center;
    min-height:100dvh;
  }

  .app{
    width:100%;
    max-width:480px;
    padding:20px 16px 28px;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
  }

  header{
    text-align:left;
    margin-bottom:16px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(1.5rem, 6vw, 1.9rem);
    letter-spacing:-0.01em;
    margin:0 0 2px;
    color:var(--ink);
  }

  .sub{
    margin:0;
    font-size:0.9rem;
    color:#5B6B75;
  }

  .difficulty{
    display:flex;
    gap:8px;
    margin-top:14px;
  }

  .diff-btn{
    flex:1;
    appearance:none;
    border:1px solid var(--line);
    background:var(--white);
    color:#5B6B75;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.76rem;
    padding:9px 4px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .diff-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .diff-btn:active{
    transform:scale(0.97);
  }

  .stats{
    display:flex;
    gap:10px;
    margin:16px 0;
  }

  .stat{
    flex:1;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 10px;
    text-align:center;
  }

  .stat .num{
    display:block;
    font-family:'Fraunces', serif;
    font-size:1.25rem;
    font-weight:600;
    line-height:1.1;
    color:var(--teal-deep);
  }

  .stat .label{
    font-size:0.68rem;
    color:#7A8791;
  }

  .board{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    width:100%;
    flex:1;
  }

  .card{
    aspect-ratio:3/4;
    perspective:800px;
    cursor:pointer;
  }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.45s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner{
    transform:rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    backface-visibility:hidden;
  }

  .face-back{
    background:linear-gradient(155deg, var(--card-back), var(--card-back-2));
  }

  .face-back::after{
    content:'';
    width:38%;
    height:38%;
    border:2px solid rgba(255,255,255,0.35);
    border-radius:50%;
  }

  .face-front{
    background:var(--white);
    border:1.5px solid var(--line);
    transform:rotateY(180deg);
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(0.95rem, 4.6vw, 1.2rem);
    color:var(--ink);
    padding:4px;
    text-align:center;
  }

  .card.matched .face-front{
    background:#EAF5F3;
    border-color:var(--teal);
    color:var(--teal-deep);
  }

  .face-front.advanced-text{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:clamp(0.62rem, 3.3vw, 0.78rem);
    line-height:1.25;
    padding:6px;
  }

  .card.mismatch .face-front{
    background:#FDEDE8;
    border-color:var(--coral);
  }

  .card.matched{
    cursor:default;
  }

  footer{
    margin-top:18px;
    display:flex;
    justify-content:center;
  }

  button.reset{
    appearance:none;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    padding:11px 22px;
    border-radius:999px;
    cursor:pointer;
  }

  button.reset:active{
    transform:scale(0.97);
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(32,48,59,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
    z-index:10;
  }

  .overlay.show{
    opacity:1;
    pointer-events:auto;
  }

  .win-card{
    background:var(--white);
    border-radius:16px;
    padding:28px 24px;
    text-align:center;
    max-width:320px;
    width:100%;
  }

  .win-card h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.4rem;
    margin:0 0 6px;
    color:var(--ink);
  }

  .win-card p{
    margin:0 0 18px;
    color:#5B6B75;
    font-size:0.92rem;
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition:none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Match It</h1>
    <p class="sub">Pair each fraction with its matching decimal or percent.</p>
  </header>

  <div class="difficulty">
    <button class="diff-btn active" id="easyBtn" data-level="easy">Easy</button>
    <button class="diff-btn" id="mediumBtn" data-level="medium">Medium</button>
    <button class="diff-btn" id="hardBtn" data-level="hard">Hard</button>
    <button class="diff-btn" id="advancedBtn" data-level="advanced">Advanced</button>
  </div>

  <div class="stats">
    <div class="stat"><span class="num" id="statMoves">0</span><span class="label">Moves</span></div>
    <div class="stat"><span class="num" id="statMatches">0/8</span><span class="label">Matched</span></div>
    <div class="stat"><span class="num" id="statTime">0:00</span><span class="label">Time</span></div>
  </div>

  <div class="board" id="board"></div>

  <footer>
    <button class="reset" id="resetBtn">New game</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <h2>All matched!</h2>
    <p id="winSummary">Nice work.</p>
    <button class="reset" id="playAgainBtn">Play again</button>
  </div>
</div>

<script>
(function(){
  const board = document.getElementById('board');
  const statMoves = document.getElementById('statMoves');
  const statMatches = document.getElementById('statMatches');
  const statTime = document.getElementById('statTime');
  const overlay = document.getElementById('overlay');
  const winSummary = document.getElementById('winSummary');
  const resetBtn = document.getElementById('resetBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');

  const PAIR_COUNT = 8;
  const FORMATS = ['fraction', 'decimal', 'percent'];

  const DIFFICULTIES = {
    easy:   { denominators: [2, 4, 5, 10], allowImproper: false },
    medium: { denominators: [4, 5, 8, 10, 20, 25], allowImproper: false },
    hard:   { denominators: [8, 16, 20, 25, 50, 100], allowImproper: true }
  };

  let currentLevel = 'easy';
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let locked = false;
  let timerId = null;
  let seconds = 0;
  let started = false;

  function gcd(a, b){ return b ? gcd(b, a % b) : a; }

  function trimNumber(str){
    if (str.indexOf('.') === -1) return str;
    return str.replace(/0+$/, '').replace(/\.$/, '');
  }

  function formatDecimal(value){
    return trimNumber(value.toFixed(4));
  }

  function formatPercent(value){
    return trimNumber((value * 100).toFixed(2)) + '%';
  }

  function randomInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pickOne(arr){
    return arr[randomInt(0, arr.length - 1)];
  }

  function round2(n){
    return Math.round((n + Number.EPSILON) * 100) / 100;
  }

  function formatDollar(n){
    return '$' + n.toFixed(2);
  }

  const ADV_FRACTIONS = [
    { a: 1, b: 2 }, { a: 1, b: 3 }, { a: 2, b: 3 },
    { a: 1, b: 4 }, { a: 3, b: 4 },
    { a: 1, b: 5 }, { a: 2, b: 5 }, { a: 3, b: 5 }, { a: 4, b: 5 },
    { a: 1, b: 8 }, { a: 3, b: 8 }, { a: 5, b: 8 }, { a: 7, b: 8 },
    { a: 1, b: 10 }, { a: 3, b: 10 }, { a: 7, b: 10 }, { a: 9, b: 10 }
  ];

  const ADV_PERCENTS = [10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90, 100, 110, 120, 125, 150, 175, 200];
  const ADV_SMALL_PERCENTS = [5, 10, 15, 20, 25, 30, 40, 50, 60, 75];
  const ADV_UNIT_DENOMS = [2, 3, 4, 5];
  const ADV_CENTS_OPTIONS = [0, 0, 0, 20, 25, 40, 50, 60, 75, 80];

  function randWholeDollar(min, max){
    return randomInt(min, max);
  }

  function randDollarWithCents(min, max){
    return randomInt(min, max) + pickOne(ADV_CENTS_OPTIONS) / 100;
  }

  const ADV_TEMPLATES = [
    function percentOf(){
      const X = randWholeDollar(6, 60);
      const P = pickOne(ADV_PERCENTS);
      return { value: round2(X * P / 100), text: P + '% of $' + X };
    },
    function fractionOf(){
      const { a, b } = pickOne(ADV_FRACTIONS);
      const X = randWholeDollar(6, 60);
      return { value: round2(X * a / b), text: a + '/' + b + ' of $' + X };
    },
    function fractionOfPercentOf(){
      const { a, b } = pickOne(ADV_FRACTIONS);
      const P = pickOne(ADV_PERCENTS);
      const X = randWholeDollar(10, 60);
      return { value: round2(X * (a / b) * (P / 100)), text: a + '/' + b + ' of ' + P + '% of $' + X };
    },
    function percentOfPercentOf(){
      const P1 = pickOne(ADV_PERCENTS);
      const P2 = pickOne(ADV_PERCENTS);
      const X = randWholeDollar(10, 60);
      return { value: round2(X * (P1 / 100) * (P2 / 100)), text: P1 + '% of ' + P2 + '% of $' + X };
    },
    function fractionChain(){
      const denom = pickOne(ADV_UNIT_DENOMS);
      const n = randomInt(2, 3);
      const k = randomInt(1, 6);
      const X = Math.pow(denom, n) * k;
      const value = round2(X / Math.pow(denom, n));
      const parts = [];
      for (let i = 0; i < n; i++) parts.push('1/' + denom);
      return { value: value, text: parts.join(' of ') + ' of $' + X };
    },
    function increaseDecrease(){
      const X = randWholeDollar(6, 60);
      const P = pickOne(ADV_SMALL_PERCENTS);
      const isIncrease = Math.random() < 0.5;
      const value = round2(isIncrease ? X * (1 + P / 100) : X * (1 - P / 100));
      const verb = isIncrease ? 'Increase' : 'Decrease';
      return { value: value, text: verb + ' $' + X + ' by ' + P + '%' };
    },
    function reversePercent(){
      const X = randDollarWithCents(4, 40);
      const P = pickOne(ADV_PERCENTS);
      const V = round2(X * P / 100);
      return { value: round2(X), text: formatDollar(V) + ' is ' + P + '% of ?' };
    }
  ];

  function generateAdvancedPairs(count){
    const pairs = [];
    const seen = new Set();
    let guard = 0;
    while (pairs.length < count && guard < 4000){
      guard++;
      const template = pickOne(ADV_TEMPLATES);
      const result = template();
      if (result.value <= 0) continue;
      const key = result.value.toFixed(2);
      if (seen.has(key)) continue;
      seen.add(key);
      pairs.push(result);
    }
    return pairs;
  }

  function generateValue(config){
    const den = config.denominators[randomInt(0, config.denominators.length - 1)];
    const maxNum = config.allowImproper ? (den * 2) - 1 : den - 1;
    let num = randomInt(1, maxNum);
    if (num === den) num += 1;
    const g = gcd(num, den);
    const rNum = num / g;
    const rDen = den / g;
    const decimal = num / den;
    return {
      key: decimal.toFixed(6),
      fraction: rNum + '/' + rDen,
      decimal: formatDecimal(decimal),
      percent: formatPercent(decimal)
    };
  }

  function generateUniqueValues(count, config){
    const values = [];
    const seen = new Set();
    let guard = 0;
    while (values.length < count && guard < 3000){
      guard++;
      const v = generateValue(config);
      if (!seen.has(v.key)){
        seen.add(v.key);
        values.push(v);
      }
    }
    return values;
  }

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = randomInt(0, i);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function pickTwoFormats(){
    return shuffle(FORMATS.slice()).slice(0, 2);
  }

  function buildDeck(){
    if (currentLevel === 'advanced'){
      const pairs = generateAdvancedPairs(PAIR_COUNT);
      const cards = [];
      pairs.forEach((pair, idx) => {
        cards.push({ pairId: idx, text: formatDollar(pair.value), advanced: false });
        cards.push({ pairId: idx, text: pair.text, advanced: true });
      });
      return shuffle(cards);
    }

    const config = DIFFICULTIES[currentLevel];
    const values = generateUniqueValues(PAIR_COUNT, config);
    const cards = [];
    values.forEach((v, idx) => {
      const [formatA, formatB] = pickTwoFormats();
      cards.push({ pairId: idx, type: formatA, text: v[formatA] });
      cards.push({ pairId: idx, type: formatB, text: v[formatB] });
    });
    return shuffle(cards);
  }

  function formatTime(total){
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function startTimer(){
    if (started) return;
    started = true;
    timerId = setInterval(() => {
      seconds++;
      statTime.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerId);
    timerId = null;
  }

  function render(){
    board.innerHTML = '';
    const deck = buildDeck();

    deck.forEach((cardData, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;
      card.dataset.pairId = cardData.pairId;

      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="face face-back"></div>' +
          '<div class="face face-front' + (cardData.advanced ? ' advanced-text' : '') + '">' + cardData.text + '</div>' +
        '</div>';

      card.addEventListener('click', () => onCardClick(card));
      board.appendChild(card);
    });
  }

  function onCardClick(card){
    if (locked) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (flipped.length === 2) return;

    startTimer();
    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2){
      moves++;
      statMoves.textContent = moves;
      checkMatch();
    }
  }

  function checkMatch(){
    const [first, second] = flipped;
    const isMatch = first.dataset.pairId === second.dataset.pairId;

    if (isMatch){
      locked = true;
      setTimeout(() => {
        first.classList.add('matched');
        second.classList.add('matched');
        matchedCount++;
        statMatches.textContent = matchedCount + '/' + PAIR_COUNT;
        flipped = [];
        locked = false;
        if (matchedCount === PAIR_COUNT){
          finishGame();
        }
      }, 350);
    } else {
      locked = true;
      first.classList.add('mismatch');
      second.classList.add('mismatch');
      setTimeout(() => {
        first.classList.remove('flipped', 'mismatch');
        second.classList.remove('flipped', 'mismatch');
        flipped = [];
        locked = false;
      }, 850);
    }
  }

  function finishGame(){
    stopTimer();
    winSummary.textContent = moves + ' moves \u00b7 ' + formatTime(seconds);
    overlay.classList.add('show');
  }

  function newGame(){
    stopTimer();
    flipped = [];
    matchedCount = 0;
    moves = 0;
    locked = false;
    seconds = 0;
    started = false;
    statMoves.textContent = '0';
    statMatches.textContent = '0/' + PAIR_COUNT;
    statTime.textContent = '0:00';
    overlay.classList.remove('show');
    render();
  }

  const diffButtons = document.querySelectorAll('.diff-btn');

  function setDifficulty(level){
    currentLevel = level;
    diffButtons.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.level === level);
    });
    newGame();
  }

  diffButtons.forEach(btn => {
    btn.addEventListener('click', () => setDifficulty(btn.dataset.level));
  });

  resetBtn.addEventListener('click', newGame);
  playAgainBtn.addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
