<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CalmBreath</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef4f6;--card:#fff;--tx:#10222b;--mute:#3d5560;--ac:#0b5c6b;--on:#fff;--line:#9db7c0;--glow:#8fd0dc;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a22;--card:#142934;--tx:#f1f7f9;--mute:#b4cad3;--ac:#6fd0e0;--on:#08202a;--line:#4b6b78;--glow:#2c7f90}}
:root[data-theme="dark"]{--bg:#0c1a22;--card:#142934;--tx:#f1f7f9;--mute:#b4cad3;--ac:#6fd0e0;--on:#08202a;--line:#4b6b78;--glow:#2c7f90}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 1.25rem/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 20px 32px;min-height:100vh;display:flex;flex-direction:column;gap:18px}
section[hidden]{display:none}
section{display:flex;flex-direction:column;gap:18px;flex:1}
h1{font-size:2.1rem;line-height:1.15;margin:8px 0 0}
h2{font-size:1.6rem;margin:0}
p{margin:0}.mute{color:var(--mute)}
button{font:inherit;color:var(--tx);cursor:pointer;min-height:72px;padding:12px 20px;border-radius:20px;border:3px solid var(--line);background:var(--card);text-align:center}
button:focus-visible{outline:4px solid var(--ac);outline-offset:3px}
button[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.primary{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700;font-size:1.5rem;min-height:88px;width:100%}
.row{display:flex;gap:12px}.row>*{flex:1}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stats{display:flex;justify-content:space-between;gap:12px}.stats b{display:block;font-size:1.7rem}
.grow{flex:1}
.link{background:none;border:none;text-decoration:underline;min-height:64px;font-size:1.2rem}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step button{min-width:72px;flex:0 0 72px;font-size:1.8rem;padding:0}
.step span{font-size:1.5rem;font-weight:700;min-width:90px;text-align:center}
/* breathing screen */
#breathe{align-items:center;text-align:center;justify-content:space-between}
#phase{font-size:2.6rem;font-weight:700;letter-spacing:.04em;min-height:3.2rem}
#orb{width:min(78vw,340px);aspect-ratio:1;display:grid;place-items:center;position:relative;margin:auto}
#orb i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--glow),var(--ac));opacity:.9;transform:scale(.55);will-change:transform;border:6px solid var(--ac);transition:opacity .6s}
#orb.hold i{opacity:1;box-shadow:0 0 0 10px var(--bg),0 0 0 16px var(--ac)}
#count{position:relative;font-size:5.5rem;font-weight:700;color:var(--on);font-variant-numeric:tabular-nums}
#hint{font-size:1.5rem}
#left{font-size:1.1rem}
@media (prefers-reduced-motion:reduce){#orb i{transition:none}}
</style>
</head>
<body>
<main>

<!-- 1 HOME -->
<section id="home">
  <h1 id="greet">Good evening</h1>
  <h2 class="mute" style="font-weight:400">How do you feel?</h2>
  <div class="row" role="group" aria-label="How do you feel" id="moods">
    <button data-mood="calm" aria-pressed="false">Calm</button>
    <button data-mood="tense" aria-pressed="false">Tense</button>
    <button data-mood="tired" aria-pressed="false">Tired</button>
  </div>
  <button class="primary" id="goStart">Start breathing</button>
  <div class="card">
    <div><span class="mute">Today's practice</span><br><b id="today">Gentle Breathing · 5 minutes</b></div>
    <div class="stats"><div><b id="streak">0 days</b><span class="mute">Streak</span></div><div><b id="total">0 min</b><span class="mute">Total</span></div></div>
  </div>
  <div class="grow"></div>
  <div class="row"><button id="goChoose">Choose session</button><button id="goSet">Settings</button></div>
</section>

<!-- 2 CHOOSE -->
<section id="choose" hidden>
  <h1>Choose a session</h1>
  <div id="list" style="display:flex;flex-direction:column;gap:14px"></div>
  <button class="link" data-back>Back</button>
</section>

<!-- 3 BREATHE -->
<section id="breathe" hidden aria-live="off">
  <div id="phase" aria-live="polite">Get ready</div>
  <div id="orb"><i></i><div id="count">3</div></div>
  <p id="hint" aria-hidden="true">Sit comfortably</p>
  <p id="left" class="mute"></p>
  <div style="width:100%;display:flex;flex-direction:column;gap:12px">
    <button id="voiceBtn">Voice: on</button>
    <div class="row"><button id="pauseBtn" class="primary" style="min-height:80px">Pause</button><button id="endBtn" style="min-height:80px">End</button></div>
  </div>
</section>

<!-- 4 DONE -->
<section id="done" hidden style="text-align:center;justify-content:center">
  <h1>Well done</h1>
  <p id="doneTxt" class="mute"></p>
  <div class="card"><b id="doneStreak" style="font-size:1.8rem"></b><span class="mute">Come back tomorrow to keep your streak.</span></div>
  <button class="primary" id="doneHome">Back to home</button>
</section>

<!-- 5 SETTINGS -->
<section id="settings" hidden>
  <h1>Settings</h1>
  <h2>Voice</h2>
  <div class="row" id="voiceOpts" role="group" aria-label="Voice">
    <button data-v="off">Off</button><button data-v="gentle">Gentle</button><button data-v="minimal">Minimal</button>
  </div>
  <h2>Sound</h2>
  <div class="row" id="soundOpts" role="group" aria-label="Sound">
    <button data-s="none">None</button><button data-s="bell">Soft bell</button><button data-s="nature">Nature</button>
  </div>
  <p class="mute">Guidance is always shown on screen too, so you never need sound.</p>
  <div class="grow"></div>
  <button class="link" id="resetBtn">Clear my progress</button>
  <button class="primary" data-back>Done</button>
</section>

</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='calmbreath.v1';
let S={mood:'',voice:'gentle',lastVoice:'gentle',sound:'bell',pattern:'gentle',mins:5,custom:{i:4,h:0,o:6},days:[],total:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const PAT={
 gentle:{n:'Gentle Breathing',d:'In 4 · Out 6',s:[4,0,6,0],m:[2,5,10]},
 slow:{n:'Slow Breathing',d:'In 5 · Out 5',s:[5,0,5,0],m:[2,5,10]},
 box:{n:'Box Breathing',d:'In 4 · Hold 4 · Out 4 · Hold 4',s:[4,4,4,4],m:[2,5]},
 custom:{n:'Custom',d:'Choose your own timing',m:[2,5,10]}
};
const secs=k=>k==='custom'?[S.custom.i,S.custom.h,S.custom.o,0]:PAT[k].s;
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();

function streak(){
  const set=new Set(S.days),d=new Date();
  if(!set.has(dkey(d)))d.setDate(d.getDate()-1);
  let n=0;while(set.has(dkey(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function show(id){
  $$('section').forEach(s=>s.hidden=s.id!==id);
  window.scrollTo(0,0);
  if(id==='home')renderHome();if(id==='choose')renderChoose();if(id==='settings')renderSet();
}
function renderHome(){
  const h=new Date().getHours();
  $('#greet').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  $$('#moods button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mood===S.mood));
  $('#today').textContent=PAT[S.pattern].n+' · '+S.mins+' minutes';
  const n=streak();$('#streak').textContent=n+(n===1?' day':' days');
  $('#total').textContent=Math.round(S.total)+' min';
}
function renderSet(){
  $$('#voiceOpts button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.voice));
  $$('#soundOpts button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===S.sound));
}
function renderChoose(){
  const L=$('#list');L.innerHTML='';
  Object.keys(PAT).forEach(k=>{
    const p=PAT[k],c=document.createElement('div');c.className='card';
    c.innerHTML='<div><b>'+p.n+'</b><br><span class="mute">'+p.d+'</span></div>';
    if(k==='custom'){
      [['i','Breathe in'],['h','Hold'],['o','Breathe out']].forEach(([f,l])=>{
        const r=document.createElement('div');r.className='step';
        r.innerHTML='<button aria-label="Less '+l+'">−</button><span>'+l+'<br>'+S.custom[f]+' s</span><button aria-label="More '+l+'">+</button>';
        const [m,pl]=r.querySelectorAll('button');
        m.onclick=()=>{S.custom[f]=Math.max(f==='h'?0:2,S.custom[f]-1);save();renderChoose()};
        pl.onclick=()=>{S.custom[f]=Math.min(12,S.custom[f]+1);save();renderChoose()};
        c.appendChild(r);
      });
    }
    const r=document.createElement('div');r.className='row';
    p.m.forEach(m=>{const b=document.createElement('button');b.textContent=m+' min';
      b.onclick=()=>{S.pattern=k;S.mins=m;save();begin()};r.appendChild(b)});
    c.appendChild(r);L.appendChild(c);
  });
}

/* ---------- audio ---------- */
let AC=null;
function ctx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function bell(f){
  const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+2);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+2.1);
}
function wave(dur,rise){
  const a=ctx();if(!a)return;const n=a.sampleRate*2,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=buf;s.loop=true;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
  const g=a.createGain(),t=a.currentTime;
  g.gain.setValueAtTime(rise?.01:.18,t);g.gain.linearRampToValueAtTime(rise?.18:.01,t+dur);
  s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+dur+.05);
}
function speak(txt){
  if(!('speechSynthesis' in window)||!txt)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=.8;u.volume=.9;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- session ---------- */
const LAB={in:['BREATHE IN','Breathe in slowly'],hold:['HOLD','Hold gently'],out:['BREATHE OUT','Breathe out slowly'],hold2:['HOLD','Rest, empty'] };
const VOICE={gentle:{in:'Breathe in.',hold:'Hold.',out:'Breathe out.',hold2:'Hold.'},minimal:{in:'In.',out:'Out.'}};
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
let R=null,wake=null,raf=0;

function build(){
  const names=['in','hold','out','hold2'],from=[.55,1,1,.55],to=[1,1,.55,.55],s=secs(S.pattern);
  return names.map((n,i)=>({n,d:s[i],a:from[i],b:to[i]})).filter(p=>p.d>0);
}
async function lock(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function unlock(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(R&&document.visibilityState==='visible'&&!wake)lock()});

function begin(){
  ctx();save();show('breathe');lock();
  R={ph:build(),i:-1,pe:0,done:0,paused:false,last:null,ready:3,total:S.mins*60};
  $('#pauseBtn').textContent='Pause';updVoiceBtn();
  $('#phase').textContent='Get ready';$('#hint').textContent='Sit comfortably';
  $('#orb').classList.remove('hold');$('#orb i').style.transform='scale(.55)';
  cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function enter(p){
  $('#phase').textContent=LAB[p.n][0];$('#hint').textContent=LAB[p.n][1];
  $('#orb').classList.toggle('hold',p.n==='hold'||p.n==='hold2');
  const v=VOICE[S.voice];if(v)speak(v[p.n]);
  if(S.sound==='bell'&&(p.n==='in'||p.n==='out'))bell(p.n==='in'?660:440);
  if(S.sound==='nature'&&(p.n==='in'||p.n==='out'))wave(p.d,p.n==='in');
}
function tick(ts){
  if(!R)return;raf=requestAnimationFrame(tick);
  if(R.paused){R.last=null;return}
  const dt=R.last==null?0:Math.min(.25,(ts-R.last)/1000);R.last=ts;
  if(R.ready>0){ // 3-second countdown
    R.ready-=dt;$('#count').textContent=Math.max(1,Math.ceil(R.ready));
    if(R.ready<=0){R.i=0;R.pe=0;enter(R.ph[0])}return;
  }
  R.pe+=dt;R.done+=dt;
  let p=R.ph[R.i];
  if(R.done>=R.total){finish(true);return}
  while(R.pe>=p.d){R.pe-=p.d;R.i=(R.i+1)%R.ph.length;p=R.ph[R.i];enter(p)}
  const x=ease(Math.min(1,R.pe/p.d));
  $('#orb i').style.transform='scale('+(p.a+(p.b-p.a)*x).toFixed(4)+')';
  $('#count').textContent=Math.max(1,Math.ceil(p.d-R.pe));
  const rem=Math.ceil(R.total-R.done);$('#left').textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0')+' left';
}
function finish(complete){
  const mins=R?R.done/60:0;
  cancelAnimationFrame(raf);R=null;unlock();try{speechSynthesis.cancel()}catch(e){}
  if(mins*60>=30||complete){
    const k=dkey(new Date());if(!S.days.includes(k))S.days.push(k);
    S.days=S.days.slice(-400);S.total+=mins;save();
    const n=streak();
    $('#doneTxt').textContent='You breathed for '+Math.max(1,Math.round(mins))+(Math.round(mins)<=1?' minute.':' minutes.');
    $('#doneStreak').textContent='Streak: '+n+(n===1?' day':' days');
    show('done');
  }else show('home');
}
function updVoiceBtn(){$('#voiceBtn').textContent='Voice: '+(S.voice==='off'?'off':'on')}

/* ---------- events ---------- */
$('#moods').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  S.mood=b.dataset.mood;
  if(S.mood==='tired'){S.pattern='gentle';S.mins=2}else{S.pattern='gentle';S.mins=5}
  save();renderHome()};
$('#goStart').onclick=begin;
$('#goChoose').onclick=()=>show('choose');
$('#goSet').onclick=()=>show('settings');
$$('[data-back]').forEach(b=>b.onclick=()=>show('home'));
$('#doneHome').onclick=()=>show('home');
$('#voiceOpts').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.voice=b.dataset.v;if(S.voice!=='off')S.lastVoice=S.voice;save();renderSet();if(S.voice!=='off')speak('Breathe in.')};
$('#soundOpts').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.sound=b.dataset.s;save();renderSet();if(S.sound==='bell')bell(660);if(S.sound==='nature')wave(2,true)};
$('#voiceBtn').onclick=()=>{if(S.voice==='off')S.voice=S.lastVoice||'gentle';else{S.lastVoice=S.voice;S.voice='off';try{speechSynthesis.cancel()}catch(e){}}save();updVoiceBtn()};
$('#pauseBtn').onclick=()=>{if(!R)return;R.paused=!R.paused;$('#pauseBtn').textContent=R.paused?'Resume':'Pause';
  if(R.paused)try{speechSynthesis.cancel()}catch(e){}};
$('#endBtn').onclick=()=>finish(false);
$('#resetBtn').onclick=()=>{if(confirm('Clear your streak and total minutes?')){S.days=[];S.total=0;save();show('home')}};
document.addEventListener('keydown',e=>{if(R&&(e.key===' '||e.key==='Escape')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();e.key===' '?$('#pauseBtn').click():finish(false)}});

show('home');
</script>
</body>
</html>
